<figure>
  {% if photo.previewable %}
    <a class="thumb" href="{{ photo.get_absolute_url }}" data-preview="{{ photo.get_absolute_url }}" data-name="{{ photo.filename }}"
       {% if photo.matched_face %}data-face="{{ photo.matched_face.box_percent }}" data-percent="{{ photo.match_percent }}"{% if photo.is_match %} data-match{% endif %}{% endif %}>
      <img src="{{ photo.get_absolute_url }}" alt="{{ photo.filename }}" loading="lazy"
           {% if photo.is_match %}style="object-position: {{ photo.matched_face.center_percent }}"{% endif %}>
      {% if photo.match_percent is not None %}
        <span class="match-badge{% if photo.is_match %} is-match{% endif %}"
              title="Best face in this photo is a {{ photo.match_percent }}% match with {{ profile.display_name|default:'the profile' }}">
          {{ photo.match_percent }}%
        </span>
      {% endif %}
    </a>
  {% else %}
    <a class="thumb" href="{{ photo.get_absolute_url }}?download=1">
      <div class="placeholder">{{ photo.content_type }}<br>no browser preview</div>
    </a>
  {% endif %}
  <figcaption>
    <span title="{{ photo.filename }}">{{ photo.filename }} · {{ photo.size|filesizeformat }}</span>
    <a href="{{ photo.get_absolute_url }}?download=1" title="Download">↓</a>
  </figcaption>
</figure>
