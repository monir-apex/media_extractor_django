{% if profile.has_photo %}<img class="avatar" src="{{ profile.get_photo_url }}" alt="{{ profile.display_name|default:'Profile photo' }}" width="{{ size }}" height="{{ size }}" style="width: {{ size }}px; height: {{ size }}px">{% else %}<span class="avatar" aria-hidden="true" style="width: {{ size }}px; height: {{ size }}px; font-size: calc({{ size }}px * .4)">{{ profile.initials }}</span>{% endif %}
